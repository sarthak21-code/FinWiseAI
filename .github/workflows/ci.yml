name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-improved/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Confirm isolated backend test database
        working-directory: backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:////tmp/finwiseai-ci-${{ github.run_id }}-${{ github.run_attempt }}.sqlite3
        run: |
          python -c "from pathlib import Path; from sqlalchemy.engine import make_url; from app.core.config import BACKEND_ROOT, settings; p=Path(make_url(settings.database_url).database).resolve(); protected=(BACKEND_ROOT/'vantageai.db').resolve(); print(f'driver={make_url(settings.database_url).drivername}'); print(f'disposable_database={p}'); assert p != protected and not p.exists()"

      - name: Run backend tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:////tmp/finwiseai-ci-${{ github.run_id }}-${{ github.run_attempt }}.sqlite3
        run: python -m pytest -q --basetemp "${{ runner.temp }}/finwise-pytest-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Install frontend dependencies from lockfile
        working-directory: frontend-improved
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend-improved
        run: npm test

      - name: Lint frontend
        working-directory: frontend-improved
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend-improved
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend-improved
        run: npm run build
